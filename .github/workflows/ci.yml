name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Pruebas (memoria)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  test-mongo:
    name: Pruebas (MongoDB)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-retries 10
    env:
      MONGO_URL: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: [test, test-mongo]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t inventario-api .
      - name: Probar que la imagen arranca
        run: |
          docker run -d --name api -p 3000:3000 inventario-api
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1
